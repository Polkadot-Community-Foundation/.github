# Required on pull requests across the organisation by the
# pcf-outside-contribution-review ruleset.
#
# A pull request opened by someone with write access to the repository passes.
# One opened by anyone else passes only once REQUIRED people with write access
# have approved its current head commit. Ruleset workflows run only when a pull
# request is opened, reopened or pushed to, so after the last approval a
# maintainer re-runs this check.
#
# It runs from this repository, never checks out the pull request, and reads
# only through the API, so pull_request_target is safe here.
name: Outside contribution review

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: read

jobs:
  approvals:
    name: outside-contribution-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check approvals
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REQUIRED: 2
        run: |
          set -euo pipefail

          # Write access or more: admin, maintain or write.
          can_write() {
            perm=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission 2>/dev/null || echo none)
            case "$perm" in admin|maintain|write) return 0 ;; *) return 1 ;; esac
          }

          # Read live, so a re-run sees the current head and reviews.
          pr=$(gh api "repos/$REPO/pulls/$PR")
          author=$(jq -r .user.login <<<"$pr")
          head=$(jq -r .head.sha <<<"$pr")

          if can_write "$author"; then
            echo "$author has write access: the repository's own review rules apply."
            exit 0
          fi

          # Each reviewer's latest decision; comments don't change it.
          approvers=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            | jq -rs --arg head "$head" --arg author "$author" '
                add
                | map(select(.state != "COMMENTED" and .state != "PENDING"))
                | group_by(.user.login)
                | map(max_by(.submitted_at))
                | map(select(.state == "APPROVED" and .commit_id == $head and .user.login != $author))
                | .[].user.login')

          count=0
          for login in $approvers; do
            if can_write "$login"; then
              echo "Approved by $login"
              count=$((count + 1))
            fi
          done

          if [ "$count" -ge "$REQUIRED" ]; then
            echo "$count approvals on ${head:0:7} from people with write access."
            exit 0
          fi

          echo "::error::Outside contribution: needs $REQUIRED approvals on ${head:0:7} from people with write access, has $count. Re-run this check after approving."
          exit 1
